# biliup-notify 推送服务 Docker 编排(只启动本服务)
# biliup 后端请使用你自己的部署(本机进程 / 已有容器 / 远程服务器),通过 BILIUP_BASEURL 指向它。
#
# 用法:
#   1. 复制 .env.example 为 .env,填写 BILIUP_BASEURL 与 Telegram 配置
#   2. docker compose up -d
#   3. 打开 http://<服务器IP>:4000
#
# 未配置 Telegram 时,可稍后在网页端配置(配置保存在 data/ 卷中)

services:
  notify:
    build: .
    image: biliup-notify:latest
    container_name: biliup-notify
    restart: unless-stopped
    ports:
      - "${NOTIFY_HOST_ADDRESS:-0.0.0.0}:${NOTIFY_PORT:-4000}:4000"
    environment:
      BILIUP_NOTIFY_NO_OPEN: "1"
      BILIUP_NOTIFY_DATA_DIR: "/app/data"
      # biliup 后端地址:
      #   - biliup 跑在宿主机上(本机/同机):填 http://host.docker.internal:<端口>
      #     (Linux 需在服务里加 extra_hosts: - "host.docker.internal:host-gateway")
      #   - biliup 是另一个容器:填 http://<容器名>:19159
      #   - biliup 在远程服务器:填 http://<IP>:<端口>
      BILIUP_NOTIFY_BILIUP_BASEURL: "${BILIUP_BASEURL:-http://host.docker.internal:19159}"
      # Telegram 配置(建议填,启动即生效;也可之后在网页端改)
      BILIUP_NOTIFY_TELEGRAM_ENABLED: "${TELEGRAM_ENABLED:-false}"
      BILIUP_NOTIFY_TELEGRAM_BOTTOKEN: "${TELEGRAM_BOTTOKEN:-}"
      BILIUP_NOTIFY_TELEGRAM_CHATIDS: "${TELEGRAM_CHATIDS:-}"
      # 出站代理(直连 Telegram 不通时填,如 http://host.docker.internal:7890)
      BILIUP_NOTIFY_PROXY: "${NOTIFY_PROXY:-}"
    volumes:
      - ./data/notify:/app/data
