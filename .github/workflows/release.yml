name: Release Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 也可手动触发(不打 tag)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency (tag vs package.json)
        # 防止"双版本号":git tag 必须与 package.json version 一致(如 tag v1.1.0 ↔ version 1.1.0)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "tag=$tag pkg=$pkg"
          if ($tag -ne $pkg) {
            throw "版本不一致: git tag 为 $tag,package.json 为 $pkg。发版前请先同步 package.json 的 version 字段"
          }

      - name: Run tests
        # CI 无 biliup 后端:SKIP_BACKEND=1;先启动服务再跑测试
        shell: pwsh
        run: |
          $env:SKIP_BACKEND = '1'
          $env:BILIUP_NOTIFY_NO_OPEN = '1'
          $env:BILIUP_NOTIFY_PORT = '4000'
          Start-Process node -ArgumentList 'server.js' -WorkingDirectory $PWD
          Start-Sleep 5
          npm test
          $ec = $LASTEXITCODE
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $ec

      - name: Build exe (Node SEA)
        run: node scripts/build-exe.mjs

      - name: Verify artifact
        shell: pwsh
        run: |
          Get-Item dist/biliup-notify-windows-x64.zip | Select-Object Name, Length
          if (-not (Test-Path 'dist/biliup-notify-windows-x64.zip')) { throw 'zip missing' }

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/biliup-notify-windows-x64.zip
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
